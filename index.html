<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXURY</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@200;300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #000000;
            --bg-ambient: #0f0d0a;
            --gold-base: #D4AF37;
            --gold-light: #F8E5A7;
            --text-main: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            user-select: none;
        }

        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 2.5rem 0;
            text-align: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            z-index: 50;
            pointer-events: none;
        }

        .dash-title {
            font-family: 'Cinzel', serif;
            color: var(--gold-base);
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            letter-spacing: 0.8em;
            margin-right: -0.8em; 
            font-weight: 600;
            text-shadow: 1px 1px 2px #000, 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .scroll-container {
            width: 100%;
            height: 100dvh;
            overflow-y: auto;
            scroll-snap-type: y mandatory; 
            scroll-behavior: smooth;
            background: radial-gradient(circle at 50% 50%, var(--bg-ambient) 0%, var(--bg-deep) 100%);
        }

        .gauge-section {
            width: 100%;
            height: 100dvh;
            scroll-snap-align: center; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2.5rem;
            position: relative;
        }

        .gauge {
            width: clamp(260px, 65vw, 450px);
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            box-shadow: 0 40px 80px rgba(0,0,0,0.95), inset 0 0 20px rgba(0,0,0,1);
            background: #000;
        }
        
        .gauge-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .readout-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .gauge-label {
            font-family: 'Cinzel', serif;
            color: #b3b3b3;
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            letter-spacing: 0.4em;
            margin-right: -0.4em;
            text-transform: uppercase;
        }

        .percentage-readout {
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            font-weight: 200;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            letter-spacing: -0.02em;
        }

        .ambient-glow {
            position: absolute;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.03) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="fixed-header">
        <h1 class="dash-title">TIME</h1>
    </div>

    <div class="scroll-container">
        <!-- DAY -->
        <div class="gauge-section">
            <div class="ambient-glow"></div>
            <div id="gauge-day" class="gauge"></div>
            <div class="readout-container">
                <div class="gauge-label">DAY</div>
                <div class="percentage-readout" id="val-day">0.000%</div>
            </div>
        </div>

        <!-- WEEK -->
        <div class="gauge-section">
            <div class="ambient-glow"></div>
            <div id="gauge-week" class="gauge"></div>
            <div class="readout-container">
                <div class="gauge-label">WEEK</div>
                <div class="percentage-readout" id="val-week">0.000%</div>
            </div>
        </div>

        <!-- MONTH -->
        <div class="gauge-section">
            <div class="ambient-glow"></div>
            <div id="gauge-month" class="gauge"></div>
            <div class="readout-container">
                <div class="gauge-label">MONTH</div>
                <div class="percentage-readout" id="val-month">0.000%</div>
            </div>
        </div>
    </div>

    <svg width="0" height="0">
        <defs>
            <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#E5C77B"/>
                <stop offset="25%" stop-color="#9C7733"/>
                <stop offset="50%" stop-color="#F2DDA4"/>
                <stop offset="75%" stop-color="#5a4217"/>
                <stop offset="100%" stop-color="#C5A059"/>
            </linearGradient>
            
            <radialGradient id="faceGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#2a2a2a"/>
                <stop offset="60%" stop-color="#111111"/>
                <stop offset="100%" stop-color="#000000"/>
            </radialGradient>

            <linearGradient id="needleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="20%" stop-color="#D4AF37"/>
                <stop offset="100%" stop-color="#73551E"/>
            </linearGradient>
        </defs>
    </svg>

    <script>
        // ==========================================
        // SYSTEM: DYNAMIC GAUGE RENDERING
        // ==========================================
        function renderGauge(containerId, svgTicksId, needleId) {
            const container = document.getElementById(containerId);
            container.innerHTML = `
                <svg viewBox="0 0 200 200" class="gauge-svg">
                    <circle cx="100" cy="100" r="98" fill="url(#bezelGrad)" stroke="#000" stroke-width="1"/>
                    <circle cx="100" cy="100" r="92" fill="#000" />
                    <circle cx="100" cy="100" r="90" fill="url(#faceGrad)" />
                    
                    <circle cx="100" cy="100" r="60" fill="transparent" stroke="#222" stroke-width="1"/>
                    <circle cx="100" cy="100" r="88" fill="transparent" stroke="rgba(0,0,0,0.8)" stroke-width="4"/>
