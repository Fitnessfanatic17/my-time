<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXURY</title>
    
    <!-- PWA Manifest and Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Luxury Typography: Cinzel for classic elegance, Montserrat for modern precision -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #000000;
            --bg-ambient: #0d0c0a;
            
            /* Piano Black Veneer */
            --panel-bg-top: #1c1c1c;
            --panel-bg-bottom: #050505;
            
            /* Champagne Gold Metal Accents */
            --gold-dark: #8a6d2b;
            --gold-base: #D4AF37;
            --gold-light: #F8E5A7;
            
            /* Chrome Bezel Highlights */
            --bezel-highlight: rgba(255, 255, 255, 0.15);
            --bezel-shadow: rgba(0, 0, 0, 0.8);
            
            --text-main: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Deep, dark cabin atmosphere */
            background: radial-gradient(circle at 50% -20%, var(--bg-ambient) 0%, var(--bg-deep) 70%);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            
            /* Responsive height and padding to ensure borders are never cut off */
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* The Instrument Cluster (Piano Black Panel) */
        .dashboard-panel {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 850px;
            
            /* Simulates polished piano black wood/acrylic */
            background: linear-gradient(160deg, var(--panel-bg-top) 0%, var(--panel-bg-bottom) 100%);
            
            /* Physical machined metal bezel simulation */
            border: 2px solid #2a2a2a;
            border-top-color: #444;
            border-bottom-color: #000;
            border-radius: 12px;
            
            /* Scalable padding and gaps to keep layout contained */
            padding: clamp(2.5rem, 5vh, 4.5rem);
            display: flex;
            flex-direction: column;
            gap: clamp(2.5rem, 6vh, 4rem);
            
            /* Drop shadow and inner glowing reflection */
            box-shadow: 
                0 40px 100px rgba(0, 0, 0, 0.95), 
                inset 0 2px 3px var(--bezel-highlight),
                inset 0 -2px 5px var(--bezel-shadow);
        }

        /* Branding / Header */
        .header {
            text-align: center;
            position: relative;
            margin-top: -1rem;
        }

        .header h1 {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: clamp(1.8rem, 4vw, 2.2rem); 
            letter-spacing: 0.6em;
            text-transform: uppercase;
            color: var(--gold-base);
            margin-right: -0.6em; 
            
            /* Subtle engraved look */
            text-shadow: 1px 1px 2px #000, -1px -1px 1px rgba(255,255,255,0.1);
        }

        /* Individual Gauge Block */
        .gauge-block {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .gauge-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .label {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: clamp(1.4rem, 3.5vw, 1.7rem); 
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #b3b3b3;
        }

        .percentage {
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            font-size: clamp(2.2rem, 5vw, 2.6rem);
            font-variant-numeric: tabular-nums; 
            letter-spacing: -0.02em;
            color: #FFFFFF;
            /* Crisp backlit cluster display */
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        /* Physical Recessed Track */
        .progress-track {
            width: 100%;
            height: 6px;
            background: #000000;
            border-radius: 3px;
            overflow: hidden;
            /* Creates the illusion of a deep groove cut into the panel */
            box-shadow: 
                inset 0 2px 4px rgba(0, 0, 0, 1), 
                inset 0 -1px 1px rgba(255, 255, 255, 0.1);
        }

        /* Sweeping Intense Gold LED / Metallic Needle */
        .progress-fill {
            height: 100%;
            border-radius: 3px;
            width: 0%; 
            /* Solid, intense glittering gold gradient without white */
            background: linear-gradient(90deg, var(--gold-dark) 0%, var(--gold-base) 70%, var(--gold-light) 100%);
            /* Ambient pure gold light bleed into the groove */
            box-shadow: 0 0 15px 3px rgba(212, 175, 55, 0.8);
            /* Smooth mechanical sweep */
            transition: width 0.1s linear;
        }

    </style>
</head>
<body>

    <div class="dashboard-panel">
        <div class="header">
            <h1>TIME</h1>
        </div>

        <!-- DAY GAUGE -->
        <div class="gauge-block">
            <div class="gauge-header">
                <div class="label">DAY</div>
                <div class="percentage" id="pct-day">0.000%</div>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="fill-day"></div>
            </div>
        </div>

        <!-- WEEK GAUGE -->
        <div class="gauge-block">
            <div class="gauge-header">
                <div class="label">WEEK</div>
                <div class="percentage" id="pct-week">0.000%</div>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="fill-week"></div>
            </div>
        </div>

        <!-- MONTH GAUGE -->
        <div class="gauge-block">
            <div class="gauge-header">
                <div class="label">MONTH</div>
                <div class="percentage" id="pct-month">0.000%</div>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="fill-month"></div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // SYSTEM: THE TEMPORAL ENGINE 
        // ==========================================
        // Text displays: COMPLETED TIME (Ticking UP)
        // Bar displays: REMAINING TIME (Shrinking DOWN)

        function calculatePercentages() {
            const now = new Date();

            // 1. DAY CALCULATION
            const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            const totalDayMs = endOfDay - startOfDay;
            const elapsedDayMs = now - startOfDay;
            const remainingDayMs = endOfDay - now;
            
            const dayPctCompleted = (elapsedDayMs / totalDayMs) * 100;
            const dayPctRemaining = (remainingDayMs / totalDayMs) * 100;

            // 2. WEEK CALCULATION (Monday to Sunday)
            const dayOfWeek = now.getDay(); 
            const distanceToMonday = (dayOfWeek + 6) % 7; 
            const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - distanceToMonday);
            const endOfWeek = new Date(startOfWeek.getFullYear(), startOfWeek.getMonth(), startOfWeek.getDate() + 7);
            const totalWeekMs = endOfWeek - startOfWeek;
            const elapsedWeekMs = now - startOfWeek;
            const remainingWeekMs = endOfWeek - now;
            
            const weekPctCompleted = (elapsedWeekMs / totalWeekMs) * 100;
            const weekPctRemaining = (remainingWeekMs / totalWeekMs) * 100;

            // 3. MONTH CALCULATION
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
            const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
            const totalMonthMs = endOfMonth - startOfMonth;
            const elapsedMonthMs = now - startOfMonth;
            const remainingMonthMs = endOfMonth - now;
            
            const monthPctCompleted = (elapsedMonthMs / totalMonthMs) * 100;
            const monthPctRemaining = (remainingMonthMs / totalMonthMs) * 100;

            return { 
                dayPctCompleted, dayPctRemaining, 
                weekPctCompleted, weekPctRemaining, 
                monthPctCompleted, monthPctRemaining 
            };
        }

        function updateHUD() {
            const stats = calculatePercentages();

            document.getElementById('pct-day').innerText = stats.dayPctCompleted.toFixed(3) + '%';
            document.getElementById('pct-week').innerText = stats.weekPctCompleted.toFixed(3) + '%';
            document.getElementById('pct-month').innerText = stats.monthPctCompleted.toFixed(3) + '%';

            document.getElementById('fill-day').style.width = stats.dayPctRemaining + '%';
            document.getElementById('fill-week').style.width = stats.weekPctRemaining + '%';
            document.getElementById('fill-month').style.width = stats.monthPctRemaining + '%';

            requestAnimationFrame(updateHUD);
        }

        requestAnimationFrame(updateHUD);
    </script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js');
        });
      }
    </script>
</body>
</html>
