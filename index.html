<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SINGULARITY // HUD</title>
    
    <!-- PWA Manifest and Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #000000;
            --bg-light: #0d0d12;
            --glass-bg: rgba(10, 10, 12, 0.6);
            --glass-border: rgba(255, 255, 255, 0.04);
            --color-glow: #FFFFFF; 
            --text-main: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Ultra-premium subtle radial depth, completely devoid of particles */
            background: radial-gradient(circle at 50% 0%, var(--bg-light) 0%, var(--bg-dark) 80%);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* Ambient backlight for the HUD */
        .ambient-glow {
            position: absolute;
            width: 60vw;
            height: 40vh;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* Monolithic Dark Glass Container */
        .hud-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 800px;
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 4rem;
            box-shadow: 0 60px 120px rgba(0, 0, 0, 0.9), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 3.5rem;
        }

        .header {
            text-align: center;
            margin-bottom: 1rem;
        }

        .header h1 {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.8em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-right: -0.8em; /* Optically center letter-spaced text */
        }

        /* Time Block Styles */
        .time-block {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .block-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .label {
            font-weight: 400;
            font-size: 1rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
        }

        .percentage {
            font-weight: 200;
            font-size: 2.2rem;
            font-variant-numeric: tabular-nums; 
            letter-spacing: -0.02em;
        }

        /* Razor-thin Progress Track */
        .progress-track {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
        }

        /* High-intensity Progress Fill */
        .progress-fill {
            height: 100%;
            border-radius: 2px;
            width: 0%; 
            background: var(--color-glow);
            box-shadow: 0 0 12px 2px rgba(255, 255, 255, 0.5);
        }

        /* Crisp Glow */
        .glow-text { 
            color: var(--color-glow); 
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3); 
        }

    </style>
</head>
<body>

    <!-- Subtle light cast behind the panel -->
    <div class="ambient-glow"></div>

    <div class="hud-container">
        <div class="header">
            <h1>TIME</h1>
        </div>

        <!-- DAY -->
        <div class="time-block">
            <div class="block-header">
                <div class="label">DAY</div>
                <div class="percentage glow-text" id="pct-day">0.000%</div>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="fill-day"></div>
            </div>
        </div>

        <!-- WEEK -->
        <div class="time-block">
            <div class="block-header">
                <div class="label">WEEK</div>
                <div class="percentage glow-text" id="pct-week">0.000%</div>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="fill-week"></div>
            </div>
        </div>

        <!-- MONTH -->
        <div class="time-block">
            <div class="block-header">
                <div class="label">MONTH</div>
                <div class="percentage glow-text" id="pct-month">0.000%</div>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="fill-month"></div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // SYSTEM: THE TEMPORAL ENGINE 
        // ==========================================
        // Text displays: COMPLETED TIME (Ticking UP)
        // Bar displays: REMAINING TIME (Shrinking DOWN)

        function calculatePercentages() {
            const now = new Date();

            // 1. DAY CALCULATION
            const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            const totalDayMs = endOfDay - startOfDay;
            const elapsedDayMs = now - startOfDay;
            const remainingDayMs = endOfDay - now;
            
            const dayPctCompleted = (elapsedDayMs / totalDayMs) * 100;
            const dayPctRemaining = (remainingDayMs / totalDayMs) * 100;

            // 2. WEEK CALCULATION (Monday to Sunday)
            const dayOfWeek = now.getDay(); 
            const distanceToMonday = (dayOfWeek + 6) % 7; 
            const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - distanceToMonday);
            const endOfWeek = new Date(startOfWeek.getFullYear(), startOfWeek.getMonth(), startOfWeek.getDate() + 7);
            const totalWeekMs = endOfWeek - startOfWeek;
            const elapsedWeekMs = now - startOfWeek;
            const remainingWeekMs = endOfWeek - now;
            
            const weekPctCompleted = (elapsedWeekMs / totalWeekMs) * 100;
            const weekPctRemaining = (remainingWeekMs / totalWeekMs) * 100;

            // 3. MONTH CALCULATION
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
            const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
            const totalMonthMs = endOfMonth - startOfMonth;
            const elapsedMonthMs = now - startOfMonth;
            const remainingMonthMs = endOfMonth - now;
            
            const monthPctCompleted = (elapsedMonthMs / totalMonthMs) * 100;
            const monthPctRemaining = (remainingMonthMs / totalMonthMs) * 100;

            return { 
                dayPctCompleted, dayPctRemaining, 
                weekPctCompleted, weekPctRemaining, 
                monthPctCompleted, monthPctRemaining 
            };
        }

        function updateHUD() {
            const stats = calculatePercentages();

            document.getElementById('pct-day').innerText = stats.dayPctCompleted.toFixed(3) + '%';
            document.getElementById('pct-week').innerText = stats.weekPctCompleted.toFixed(3) + '%';
            document.getElementById('pct-month').innerText = stats.monthPctCompleted.toFixed(3) + '%';

            document.getElementById('fill-day').style.width = stats.dayPctRemaining + '%';
            document.getElementById('fill-week').style.width = stats.weekPctRemaining + '%';
            document.getElementById('fill-month').style.width = stats.monthPctRemaining + '%';

            requestAnimationFrame(updateHUD);
        }

        requestAnimationFrame(updateHUD);
    </script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js');
        });
      }
    </script>
</body>
</html>
