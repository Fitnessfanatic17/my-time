<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXURY // INSTRUMENTS</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Luxury Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@200;300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #000000;
            --bg-ambient: #11100e;
            --dash-leather: #0a0a0a;
            --gold-base: #D4AF37;
            --text-main: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 50% -20%, var(--bg-ambient) 0%, var(--bg-deep) 80%);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            user-select: none;
        }

        /* Ambient Cabin Light */
        .cabin-glow {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80vw;
            height: 50vh;
            background: radial-gradient(ellipse at top, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Leather & Carbon Fiber Dashboard Binnacle */
        .dashboard-wrapper {
            position: relative;
            z-index: 10;
            background: linear-gradient(145deg, #181818 0%, #050505 100%);
            border: 2px solid #222;
            border-top-color: #333;
            border-bottom-color: #000;
            border-radius: 40px;
            padding: clamp(2rem, 5vh, 4rem) clamp(2rem, 5vw, 4rem);
            box-shadow: 
                0 40px 80px rgba(0,0,0,0.95), 
                inset 0 4px 10px rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3rem;
            width: 100%;
            max-width: 1100px;
        }

        .dash-title {
            font-family: 'Cinzel', serif;
            color: var(--gold-base);
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            letter-spacing: 0.8em;
            margin-right: -0.8em;
            font-weight: 600;
            text-shadow: 1px 1px 2px #000, -1px -1px 1px rgba(255,255,255,0.1);
        }

        .gauges-container {
            display: flex;
            flex-direction: row;
            gap: clamp(2rem, 4vw, 4rem);
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .gauge {
            width: clamp(240px, 25vw, 300px);
            height: auto;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            box-shadow: 0 30px 50px rgba(0,0,0,0.9);
        }
        
        .gauge-svg {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <div class="cabin-glow"></div>

    <div class="dashboard-wrapper">
        <h1 class="dash-title">POWER RESERVE</h1>
        
        <div class="gauges-container">
            <div id="gauge-day" class="gauge"></div>
            <div id="gauge-week" class="gauge"></div>
            <div id="gauge-month" class="gauge"></div>
        </div>
    </div>

    <!-- Reusable SVG Gradients for the Machined Metal and Dials -->
    <svg width="0" height="0">
        <defs>
            <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#E5C77B"/>
                <stop offset="25%" stop-color="#9C7733"/>
                <stop offset="50%" stop-color="#F2DDA4"/>
                <stop offset="75%" stop-color="#5a4217"/>
                <stop offset="100%" stop-color="#C5A059"/>
            </linearGradient>
            
            <radialGradient id="faceGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#2a2a2a"/>
                <stop offset="60%" stop-color="#111111"/>
                <stop offset="100%" stop-color="#000000"/>
            </radialGradient>

            <linearGradient id="needleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="20%" stop-color="#D4AF37"/>
                <stop offset="100%" stop-color="#73551E"/>
            </linearGradient>
        </defs>
    </svg>

    <script>
        // ==========================================
        // SYSTEM: DYNAMIC GAUGE RENDERING
        // ==========================================
        function renderGauge(containerId, title, svgTicksId, needleId, valId) {
            const container = document.getElementById(containerId);
            container.innerHTML = `
                <svg viewBox="0 0 200 200" class="gauge-svg">
                    <!-- Outer Chrome/Gold Bezel -->
                    <circle cx="100" cy="100" r="98" fill="url(#bezelGrad)" stroke="#000" stroke-width="1"/>
                    <circle cx="100" cy="100" r="93" fill="#000" />
                    <!-- Inner Deep Black Dial Face -->
                    <circle cx="100" cy="100" r="91" fill="url(#faceGrad)" />
                    <!-- Inner Shadow for Depth -->
                    <circle cx="100" cy="100" r="91" fill="transparent" stroke="rgba(0,0,0,0.7)" stroke-width="5"/>
                    
                    <!-- Tick Marks -->
                    <g id="${svgTicksId}"></g>

                    <!-- Automotive E and F Indicators -->
                    <text x="35" y="165" fill="#cc0000" font-family="'Cinzel', serif" font-size="16" font-weight="700" text-anchor="middle">E</text>
                    <text x="165" y="165" fill="#D4AF37" font-family="'Cinzel', serif" font-size="16" font-weight="700" text-anchor="middle">F</text>

                    <!-- Gauge Title & Digital Readout -->
                    <text x="100" y="75" fill="#D4AF37" font-family="'Cinzel', serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="3">${title}</text>
                    <text id="${valId}" x="100" y="145" fill="#FFF" font-family="'Montserrat', sans-serif" font-size="18" font-weight="300" text-anchor="middle">0.00%</text>

                    <!-- Sweeping Analog Needle -->
                    <g id="${needleId}" style="transform-origin: 100px 100px; filter: drop-shadow(0px 8px 6px rgba(0,0,0,0.8));">
                        <polygon points="97,105 103,105 100,15" fill="url(#needleGrad)"/>
                        <!-- White Illuminated Tip -->
                        <polygon points="99,105 101,105 100,16" fill="#FFF"/>
                    </g>
                    
                    <!-- Center Hub -->
                    <circle cx="100" cy="100" r="14" fill="url(#bezelGrad)" stroke="#111" stroke-width="1.5"/>
                    <circle cx="100" cy="100" r="7" fill="#111" />
                    
                    <!-- 3D Glass Glare Reflection -->
                    <path d="M 15 80 A 85 85 0 0 1 185 80 A 120 120 0 0 0 15 80 Z" fill="rgba(255,255,255,0.03)" />
                </svg>
            `;

            const tickGroup = document.getElementById(svgTicksId);
            // 240 degree span (-120 to +120), placing a tick every 10 degrees
            for (let i = -120; i <= 120; i += 10) {
                const isMajor = i % 30 === 0; 
                const isRed = i <= -90; // Bottom 30 degrees acts as the empty "Redline"
                
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", "100");
                line.setAttribute("y1", isMajor ? "15" : "21");
                line.setAttribute("x2", "100");
                line.setAttribute("y2", "28");
                line.setAttribute("stroke", isRed ? "#cc0000" : (isMajor ? "#D4AF37" : "#555"));
                line.setAttribute("stroke-width", isMajor ? "2" : "1.5");
                line.setAttribute("transform", `rotate(${i} 100 100)`);
                tickGroup.appendChild(line);
            }
        }

        // ==========================================
        // SYSTEM: THE TEMPORAL ENGINE 
        // ==========================================
        function calculatePercentages() {
            const now = new Date();

            // 1. DAY CALCULATION (Milliseconds for buttery smooth analog sweeping)
            const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            const totalDayMs = endOfDay - startOfDay;
            const remainingDayMs = endOfDay - now;
            const dayPctRemaining = (remainingDayMs / totalDayMs) * 100;

            // 2. WEEK CALCULATION 
            const dayOfWeek = now.getDay(); 
            const distanceToMonday = (dayOfWeek + 6) % 7; 
            const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - distanceToMonday);
            const endOfWeek = new Date(startOfWeek.getFullYear(), startOfWeek.getMonth(), startOfWeek.getDate() + 7);
            const totalWeekMs = endOfWeek - startOfWeek;
            const remainingWeekMs = endOfWeek - now;
            const weekPctRemaining = (remainingWeekMs / totalWeekMs) * 100;

            // 3. MONTH CALCULATION
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
            const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
            const totalMonthMs = endOfMonth - startOfMonth;
            const remainingMonthMs = endOfMonth - now;
            const monthPctRemaining = (remainingMonthMs / totalMonthMs) * 100;

            return { dayPctRemaining, weekPctRemaining, monthPctRemaining };
        }

        function updateHUD() {
            const stats = calculatePercentages();

            // Update Digital Readouts
            document.getElementById('val-day').textContent = stats.dayPctRemaining.toFixed(2) + '%';
            document.getElementById('val-week').textContent = stats.weekPctRemaining.toFixed(2) + '%';
            document.getElementById('val-month').textContent = stats.monthPctRemaining.toFixed(2) + '%';

            // Calculate Analog Needle Angles (-120deg to +120deg)
            const dayAngle = (stats.dayPctRemaining / 100) * 240 - 120;
            const weekAngle = (stats.weekPctRemaining / 100) * 240 - 120;
            const monthAngle = (stats.monthPctRemaining / 100) * 240 - 120;

            // Direct Transform Application (No CSS transitions needed due to millisecond precision)
            document.getElementById('needle-day').style.transform = `rotate(${dayAngle}deg)`;
            document.getElementById('needle-week').style.transform = `rotate(${weekAngle}deg)`;
            document.getElementById('needle-month').style.transform = `rotate(${monthAngle}deg)`;

            requestAnimationFrame(updateHUD);
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            renderGauge('gauge-day', 'DAY', 'ticks-day', 'needle-day', 'val-day');
            renderGauge('gauge-week', 'WEEK', 'ticks-week', 'needle-week', 'val-week');
            renderGauge('gauge-month', 'MONTH', 'ticks-month', 'needle-month', 'val-month');
            requestAnimationFrame(updateHUD);
        });
    </script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js');
        });
      }
    </script>
</body>
</html>
