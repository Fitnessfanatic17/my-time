<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXURY</title>
    
    <!-- PWA Manifest and Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Luxury Typography: Cinzel for classic elegance, Montserrat for modern precision -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #000000;
            --bg-ambient: #0d0c0a;
            
            /* Piano Black Veneer */
            --panel-bg-top: #1c1c1c;
            --panel-bg-bottom: #050505;
            
            /* Champagne Gold Metal Accents */
            --gold-dark: #7a6332;
            --gold-base: #C5A059;
            --gold-light: #F8E5A7;
            
            /* Chrome Bezel Highlights */
            --bezel-highlight: rgba(255, 255, 255, 0.15);
            --bezel-shadow: rgba(0, 0, 0, 0.8);
            
            --text-main: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Deep, dark cabin atmosphere */
            background: radial-gradient(circle at 50% -20%, var(--bg-ambient) 0%, var(--bg-deep) 70%);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* The Instrument Cluster (Piano Black Panel) */
        .dashboard-panel {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 850px;
            
            /* Simulates polished piano black wood/acrylic */
            background: linear-gradient(160deg, var(--panel-bg-top) 0%, var(--panel-bg-bottom) 100%);
            
            /* Physical machined metal bezel simulation */
            border: 2px solid #2a2a2a;
            border-top-color: #444;
            border-bottom-color: #000;
            border-radius: 12px;
            
            padding: 4.5rem;
            
            /* Drop shadow and inner glowing reflection */
            box-shadow: 
                0 40px 100px rgba(0, 0, 0, 0.95), 
                inset 0 2px 3px var(--bezel-highlight),
                inset 0 -2px 5px var(--bezel-shadow);
                
            display: flex;
            flex-direction: column;
            gap: 4rem;
        }

        /* Branding / Header */
        .header {
            text-align: center;
            margin-bottom: -1rem;
            position: relative;
        }

        .header h1 {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: 1.4rem;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            color: var(--gold-base);
            margin-right: -0.6em; 
            
            /* Subtle engraved look */
            text-shadow: 1px 1px 2px #000, -1px -1px 1px rgba(255,255,255,0.1);
        }

        /* Decorative Chrome Line */
        .header::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-base), transparent);
        }

        /* Individual Gauge Block */
        .gauge-block {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .gauge-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .label {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #999;
        }

        .percentage {
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            font-size: 2.2rem;
            font-variant-numeric: tabular-nums; 
            letter-spacing: -0.02em;
            color: #FFFFFF;
            /* Crisp backlit cluster display */
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        /* Physical Recessed Track */
        .progress-track {
            width: 100%;
            height: 6px;
            background: #000000;
            border-radius: 3px;
            overflow: hidden;
            /* Creates the illusion of a deep groove cut into the panel */
            box-shadow: 
                inset 0 2px 4px rgba(0, 0, 0, 1), 
                inset 0 -1px 1px rgba(255, 255, 255, 0.1);
        }

        /* Sweeping LED / Metallic Needle */
        .progress-fill {
            height: 100%;
            border-radius: 3px;
            width: 0%; 
            /* Rich metallic gold gradient */
            background: linear-gradient(90deg, var(--gold-dark) 0%, var(--gold-base) 60%, var(--gold-light) 100%);
            /* Ambient light bleed into the groove */
            box-shadow: 0 0 12px 1px rgba(197, 160, 89, 0.6);
            /* Smooth mechanical sweep */
            transition: width 0.1s linear;
        }

        /* Add a subtle highlight to the tip of the progress bar */
        .progress-fill::after {
            content: '';
            display: block;
            float: right;
            width: 4px;
            height: 100%;
            background: #FFFFFF;
            border-radius: 2px;
            box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.8);
        }

    </style>
</head>
<body>

    <div class="dashboard-panel">
        <div class="header">
            <h1>TIME</h1>
        </div>

        <!-- DAY GAUGE -->
        <div class="gauge-block">
            <div class="gauge-header">
                <div class="label">DAY</div>
                <div class="percentage" id="pct-day">0.000%</div>
            </div>
            <div class="progress-track">
